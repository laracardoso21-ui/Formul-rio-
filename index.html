<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        /* =========================
           VARIÁVEIS DE CORES
        ========================== */
        :root {
            --cor-principal: #6a0dad;
            --cor-secundaria: #9c27b0;
            --cor-destaque: #d8b4fe;
            --cor-fundo: #f5efff;
            --cor-card: #ffffff;
            --cor-texto: #2d163b;
            --cor-texto-claro: #ffffff;
            --cor-borda: #c4a7d7;
            --sombra: 0 4px 15px rgba(80, 20, 120, 0.15);
        }

        /* =========================
           CONFIGURAÇÃO GERAL
        ========================== */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--cor-fundo);
            color: var(--cor-texto);
        }

        /* =========================
           HEADER
        ========================== */
        header {
            background-color: var(--cor-principal);
            color: var(--cor-texto-claro);
            padding: 30px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin-bottom: 0;
        }

        /* =========================
           MENU
        ========================== */
        nav {
            background-color: var(--cor-secundaria);
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: var(--cor-texto-claro);
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            color: var(--cor-destaque);
        }

        /* =========================
           CONTEÚDO PRINCIPAL
        ========================== */
        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        /* =========================
           FORMULÁRIO
        ========================== */
        form {
            background-color: var(--cor-card);
            padding: 30px;
            border-radius: 12px;
            box-shadow: var(--sombra);
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--cor-borda);
            border-radius: 6px;
            font-size: 16px;
        }

        /* Estilo específico para input do tipo range e file */
        input[type="range"] {
            padding: 0;
            cursor: pointer;
        }

        input[type="file"] {
            background-color: #faf5ff;
            cursor: pointer;
        }

        button {
            background-color: var(--cor-principal);
            color: white;
            border: none;
            padding: 12px 25px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            font-size: 16px;
            width: 100%;
        }

        button:hover {
            opacity: 0.8;
        }

        /* =========================
           FOOTER
        ========================== */
        footer {
            background-color: var(--cor-principal);
            color: var(--cor-texto-claro);
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- =========================
         CABEÇALHO
    ========================== -->
    <header id="inicio">
        <h1>Formulário de Informações Gerais</h1>
        <p>Digite suas informações📄</p>
    </header>

    <!-- =========================
         MENU
    ========================== -->
    <nav>
        <a href="#inicio">Início</a>
        <a href="#formulario">Formulário</a>
        <a href="#contato">Contato</a>
    </nav>

    <!-- =========================
         CONTEÚDO PRINCIPAL
    ========================== -->
    <main>
        <form id="formulario">
            <!-- 1. Telefone -->
            <div class="campo">
                <label for="telefone">1. Telefone / WhatsApp (tel):</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(00) 90000-0000">
            </div>

            <!-- 2. URL / Website -->
            <div class="campo">
                <label for="site">2. Perfil ou Portfólio (url):</label>
                <input type="url" id="site" name="site" placeholder="https://seu-usuario.github.io">
            </div>

            <!-- 3. Hora -->
            <div class="campo">
                <label for="horario">3. Horário de Preferência (time):</label>
                <input type="time" id="horario" name="horario">
            </div>

            <!-- 4. Arquivo -->
            <div class="campo">
                <label for="curriculo">4. Enviar Documento / Foto (file):</label>
                <input type="file" id="curriculo" name="curriculo">
            </div>

            <!-- 5. Intervalo / Deslizante -->
            <div class="campo">
                <label for="satisfacao">5. Nível de Conhecimento em HTML (range):</label>
                <input type="range" id="satisfacao" name="satisfacao" min="0" max="100" step="10">
            </div>

            <!-- 6. Pesquisa -->
            <div class="campo">
                <label for="busca">6. Campo de Busca (search):</label>
                <input type="search" id="busca" name="busca" placeholder="Digite o que procura...">
            </div>

            <!-- 7. Mês e Ano -->
            <div class="campo">
                <label for="mes_ano">7. Mês e Ano de Início (month):</label>
                <input type="month" id="mes_ano" name="mes_ano">
            </div>

            <!-- 8. Semana e Ano -->
            <div class="campo">
                <label for="semana">8. Semana do Ano (week):</label>
                <input type="week" id="semana" name="semana">
            </div>

            <button type="submit">
                Enviar Dados
            </button>
        </form>
    </main>

    <!-- =========================
         RODAPÉ
    ========================== -->
    <footer id="contato">
      
    </footer>

</body>
</html>
