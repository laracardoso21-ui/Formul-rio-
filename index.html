<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Informações</title>
    <style>
        /* =========================
           VARIÁVEIS DE CORES
        ========================== */
        :root {
            --cor-principal: #3a9bdc;
            --cor-secundaria: #68b8f0;
            --cor-destaque: #e0f2fe;
            --cor-fundo: #f0f8ff;
            --cor-card: #ffffff;
            --cor-texto: #1a365d;
            --cor-texto-claro: #ffffff;
            --cor-borda: #bae6fd;
            --sombra: 0 4px 15px rgba(58, 155, 220, 0.15);
        }

        /* =========================
           CONFIGURAÇÃO GERAL
        ========================== */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--cor-fundo);
            color: var(--cor-texto);
        }

        /* =========================
           HEADER
        ========================== */
        header {
            background-color: var(--cor-principal);
            color: var(--cor-texto-claro);
            padding: 30px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin-bottom: 0;
        }

        /* =========================
           MENU
        ========================== */
        nav {
            background-color: var(--cor-secundaria);
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: var(--cor-texto-claro);
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            color: var(--cor-destaque);
        }

        /* =========================
           CONTEÚDO PRINCIPAL
        ========================== */
        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        /* =========================
           FORMULÁRIO
        ========================== */
        form {
            background-color: var(--cor-card);
            padding: 30px;
            border-radius: 12px;
            box-shadow: var(--sombra);
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--cor-borda);
            border-radius: 6px;
            font-size: 16px;
        }

        input[type="range"] {
            padding: 0;
            cursor: pointer;
        }

        input[type="file"] {
            background-color: #f8fafc;
            cursor: pointer;
        }

        button {
            background-color: var(--cor-principal);
            color: white;
            border: none;
            padding: 12px 25px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            font-size: 16px;
            width: 100%;
        }

        button:hover {
            opacity: 0.85;
        }

        /* =========================
           FOOTER
        ========================== */
        footer {
            background-color: var(--cor-principal);
            color: var(--cor-texto-claro);
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- =========================
         CABEÇALHO
    ========================== -->
    <header id="inicio">
        <h1>Formulário de Informações</h1>
        <p>Exemplo prático de formulário HTML com 8 novos tipos de entrada</p>
    </header>

    <!-- =========================
         MENU
    ========================== -->
    <nav>
        <a href="#inicio">Início</a>
        <a href="#formulario">Formulário</a>
        <a href="#contato">Contato</a>
    </nav>

    <!-- =========================
         CONTEÚDO PRINCIPAL
    ========================== -->
    <main>
        <form id="formulario">
            <!-- 1. Telefone -->
            <div class="campo">
                <label for="telefone">1. Telefone de Contato:</label>
                <input type="tel" id="telefone" name="telefone" placeholder="43 99999-9999">
            </div>

            <!-- 2. Link / URL -->
            <div class="campo">
                <label for="site">2. Link do Seu Perfil:</label>
                <input type="url" id="site" name="site" placeholder="https://github.com/seu-usuario">
            </div>

            <!-- 3. Horário -->
            <div class="campo">
                <label for="horario">3. Horário de Preferência:</label>
                <input type="time" id="horario" name="horario">
            </div>

            <!-- 4. Upload de Arquivo -->
            <div class="campo">
                <label for="arquivo">4. Anexar Documento ou Foto:</label>
                <input type="file" id="arquivo" name="arquivo">
            </div>

            <!-- 5. Barra Deslizante -->
            <div class="campo">
                <label for="nivel">5. Nível de Conhecimento:</label>
                <input type="range" id="nivel" name="nivel" min="0" max="100" step="10">
            </div>

            <!-- 6. Campo de Busca -->
            <div class="campo">
                <label for="pesquisa">6. Pesquisa de Conteúdo:</label>
                <input type="search" id="pesquisa" name="pesquisa" placeholder="Digite o que deseja pesquisar...">
            </div>

            <!-- 7. Mês e Ano -->
            <div class="campo">
                <label for="mes">7. Mês e Ano de Entrada:</label>
                <input type="month" id="mes" name="mes">
            </div>

            <!-- 8. Semana -->
            <div class="campo">
                <label for="semana">8. Semana do Ano:</label>
                <input type="week" id="semana" name="semana">
            </div>

            <button type="submit">
                Enviar Dados
            </button>
        </form>
    </main>

    <!-- =========================
         RODAPÉ
    ========================== -->
    <footer id="contato">
    </footer>

</body>
</html>
